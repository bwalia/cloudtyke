.wrap{display:grid;grid-template-columns:560px 1fr;height:627px}
.left{padding:50px 26px 46px 60px;display:flex;flex-direction:column}

.chip b{color:#0f6b5f}
.right{position:relative;display:flex;align-items:center;padding:30px 44px 30px 6px}
.card{background:#fff;border:1px solid #d5dbd2;border-radius:22px;padding:14px;box-shadow:0 24px 60px rgba(24,32,46,.14);width:100%}
.url{position:absolute;right:44px;bottom:26px;font:600 15px 'JetBrains Mono',monospace;color:#0f6b5f;background:#d8efe9;border-radius:999px;padding:6px 14px}
.tag{position:absolute;right:44px;top:30px;font:700 13px Poppins;letter-spacing:.12em;text-transform:uppercase;color:#536071}
