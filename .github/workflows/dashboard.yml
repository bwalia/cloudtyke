name: dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  pull_request:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: dashboard

jobs:
  build:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  live:
    name: against a running emulator (Docker)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: azure-emulator
    steps:
      - uses: actions/checkout@v4
      - name: Start emulator + dashboard
        run: docker compose --profile dashboard up -d --build --wait
      - name: Smoke test through the dashboard proxy
        run: |
          set -e
          b=http://127.0.0.1:4310
          curl -fsS "$b/" -o /dev/null
          curl -fsS "$b/api/session" | grep -q '"persona":"owner"'
          curl -fsS "$b/api/emu/arm/subscriptions?api-version=2024-11-01" | grep -q sub-sandbox
          curl -fsS "$b/api/emu/graph/v1.0/users" | grep -q ada@
          curl -fsS "$b/api/emu/admin/selftest?format=json" | grep -q '"failed": 0'
          # the reader identity is denied writes by the emulator's RBAC
          code=$(curl -s -o /dev/null -w '%{http_code}' -b ct-persona=reader -X PUT -H 'content-type: application/json' \
            -d '{"location":"uksouth"}' "$b/api/emu/arm/subscriptions/5b5c0000-0000-4000-8000-000000000003/resourcegroups/rg-ci?api-version=2024-11-01")
          test "$code" = 403
      - name: Logs
        if: failure()
        run: docker compose --profile dashboard logs
