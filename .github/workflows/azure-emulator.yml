name: azure-emulator

on:
  push:
    branches: [main]
    paths: ["azure-emulator/**", ".github/workflows/azure-emulator.yml"]
  pull_request:
    paths: ["azure-emulator/**", ".github/workflows/azure-emulator.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: azure-emulator

jobs:
  unit:
    name: lint, unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: azure-emulator/go.mod
          cache-dependency-path: azure-emulator/go.sum
      - run: make lint
      - run: make coverage-check
      - name: Unit, integration and per-service tests (race detector)
        run: make test-all SKIP_E2E=1 GO_TEST_FLAGS="-race -count=1"
      - name: Publish summary
        if: always()
        run: test -f reports/summary.md && cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: azure-emulator/reports/

  terraform-e2e:
    name: e2e (${{ matrix.tool }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        tool: [tofu, terraform]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: azure-emulator/go.mod
          cache-dependency-path: azure-emulator/go.sum
      - name: Start a fresh emulator
        run: |
          CLOUDTYKE_EPHEMERAL=true docker compose up -d --build --wait
          docker compose --profile tools build toolbox
      - name: Live self-test endpoint in the container
        run: docker compose --profile tools run --rm -T toolbox curl -fsS -o /dev/null -w "selftest %{http_code}\n" "https://management.cloudtyke.local/_cloudtyke/selftest?format=json"
      - name: init / validate / apply / plan (no drift) / destroy
        run: |
          mkdir -p reports
          set -o pipefail
          if [ "${{ matrix.tool }}" = "tofu" ]; then make tf-e2e; else make tf-e2e-terraform; fi 2>&1 | tee reports/e2e.log
      - name: Report
        if: always()
        run: |
          go run ./test/report -in "" -e2e "${{ matrix.tool }}=reports/e2e.log" -out reports || true
          test -f reports/summary.md && cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.tool }}
          path: azure-emulator/reports/
      - name: Emulator diagnostics
        if: failure()
        run: |
          docker compose logs emulator | tail -200
          docker compose run --rm -T toolbox curl -s "https://management.cloudtyke.local/_cloudtyke/requests?limit=200" || true
      - name: Tear down
        if: always()
        run: docker compose --profile tools down -v

  aks-k3s:
    name: AKS on k3s (kubectl + workload identity)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Start the emulator with the k3s AKS backend
        run: CLOUDTYKE_EPHEMERAL=true make up-k3s
      - name: Create a cluster, use kubectl, exchange a service account token for an Entra token
        run: make aks-k3s-smoke
      - name: Diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.k3s.yml logs emulator | tail -200
          docker ps -a --filter label=cloudtyke.managed=true
      - name: Tear down
        if: always()
        run: |
          docker ps -aq --filter label=cloudtyke.managed=true | xargs -r docker rm -f
          docker compose -f docker-compose.yml -f docker-compose.k3s.yml --profile tools down -v

  contoso-pay:
    name: Contoso Pay scenario (Terraform + live apps + OpenTelemetry)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Start a fresh emulator
        run: CLOUDTYKE_EPHEMERAL=true docker compose up -d --build --wait
      - name: Scenario lifecycle (apply, no-drift plan, protected-data teardown, destroy)
        run: make tf-e2e EXAMPLES=scenarios/contoso-pay/terraform
      - name: Deploy the estate and start the apps
        run: make contoso-pay
      - name: Smoke test (checkout, Key Vault, Blob, Files, Jaeger, Prometheus, Loki)
        run: make contoso-pay-smoke
      - name: Diagnostics
        if: failure()
        run: |
          docker compose -f scenarios/contoso-pay/apps/docker-compose.yml ps
          docker compose -f scenarios/contoso-pay/apps/docker-compose.yml logs --tail 80 gateway risk-engine storefront settlement-batch otel-collector
          docker compose logs emulator | tail -200
      - name: Tear down
        if: always()
        run: |
          docker compose -f scenarios/contoso-pay/apps/docker-compose.yml down -v || true
          docker compose --profile tools down -v

  labs:
    name: labs (${{ matrix.tool }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        tool: [tofu, terraform]
    steps:
      - uses: actions/checkout@v4
      - name: Start a fresh emulator
        run: CLOUDTYKE_EPHEMERAL=true docker compose up -d --build --wait
      - name: Hub-and-spoke lab (six graded stages)
        run: make lab-hub-spoke TOOL=${{ matrix.tool }}
      - name: Virtual Network Manager lab (four graded stages, two regions)
        run: make lab-avnm TOOL=${{ matrix.tool }}
      - name: Diagnostics
        if: failure()
        run: docker compose logs emulator | tail -200
      - name: Tear down
        if: always()
        run: docker compose --profile tools down -v
