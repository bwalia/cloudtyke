# www.cloudtyke.dev (and the apex, which GitHub redirects to www): the Next.js
# site in website/, exported as static files and published with GitHub Pages.
name: website (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["website/**", "landing-zone-stadium/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "landing-zone-stadium/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Check the export
        run: |
          test -f out/index.html
          test "$(cat out/CNAME)" = "www.cloudtyke.dev"
          grep -q "A small cloud for" out/index.html
          test -f out/arena/site/index.html && test -f out/arena/site/chapters/01-build.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
